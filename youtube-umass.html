<!doctype html>
<html>
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none; /* prevents interaction */
    }
  </style>
</head>

<body>
  <iframe
    src="https://www.youtube.com/embed/0XMkvtQb9QY?autoplay=1&controls=0&modestbranding=1&rel=0&fs=0&disablekb=1&playsinline=1&iv_load_policy=3&cc_load_policy=1&cc_lang_pref=en&vq=hd2160&loop=1&playlist=0XMkvtQb9QY&origin=https://www.youtube.com"
    allow="autoplay; encrypted-media"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
